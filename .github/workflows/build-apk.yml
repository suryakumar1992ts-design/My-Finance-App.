name: Build Real Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova & Build Android APK
        run: |
          npm install -g cordova
          cordova create myapp com.myfinance.app "My Finance"
          cd myapp
          cordova platform add android
          rm -rf www/*
          cp -r ../index.html www/
          if [ -f "../icon.png" ]; then cp ../icon.png www/; fi
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Finance-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
