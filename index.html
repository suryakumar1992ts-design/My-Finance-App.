<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Finance App</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #007bff; }
        .btn { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #0056b3; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .hidden { display: none; }
        .card { background: #e9ecef; padding: 10px; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>My Finance</h2>
    
    <!-- Main Dashboard -->
    <div id="dashboard">
        <div class="card">
            <h3>Balance: ₹<span id="balance">0</span></h3>
        </div>
        <button class="btn" onclick="showSettingsLogin()">Settings & AI Assistant</button>
    </div>

    <!-- Settings Password Screen -->
    <div id="settingsLogin" class="hidden">
        <h3>Enter Settings Password</h3>
        <input type="password" id="passInput" placeholder="Enter Password (Surya@777)">
        <button class="btn" onclick="verifyPassword()">Login</button>
        <button class="btn" style="background: #6c757d;" onclick="backToDashboard()">Back</button>
    </div>

    <!-- Settings & AI Assistant Screen -->
    <div id="settingsPanel" class="hidden">
        <h3>AI Assistant & Settings</h3>
        <p>Welcome, Admin! Configure your app here.</p>
        <label>AI Assistant Command:</label>
        <input type="text" id="aiCommand" placeholder="e.g., Reset data or add income">
        <button class="btn" onclick="runAIAssistant()">Run AI Command</button>
        <div id="aiResponse" class="card hidden"></div>
        <button class="btn" style="background: #dc3545; margin-top: 20px;" onclick="backToDashboard()">Logout</button>
    </div>
</div>

<script>
    function showSettingsLogin() {
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('settingsLogin').classList.remove('hidden');
    }

    function verifyPassword() {
        const pass = document.getElementById('passInput').value;
        if (pass === 'Surya@777') {
            document.getElementById('settingsLogin').classList.add('hidden');
            document.getElementById('settingsPanel').classList.remove('hidden');
            document.getElementById('passInput').value = '';
        } else {
            alert('Wrong Password! Use Surya@777');
        }
    }

    function runAIAssistant() {
        const cmd = document.getElementById('aiCommand').value;
        const resDiv = document.getElementById('aiResponse');
        resDiv.classList.remove('hidden');
        resDiv.innerHTML = "<b>AI Processing:</b> Executing command '" + cmd + "' successfully!";
    }

    function backToDashboard() {
        document.getElementById('settingsLogin').classList.add('hidden');
        document.getElementById('settingsPanel').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
    }
</script>

</body>
</html>
