<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Finance App</title>
    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #fd7e14;
            --info: #17a2b8;
            --bg: #f4f6f9;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2, h3 { text-align: center; color: var(--primary); margin-top: 5px; }
        .card { background: #e9ecef; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn:hover { opacity: 0.9; }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        .btn-warning { background: var(--warning); color: white; }
        .btn-info { background: var(--info); }
        .btn-clear { background: #6c757d; color: white; }
        input, select { width: 100%; padding: 10px; margin: 6px 0 12px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .hidden { display: none !important; }
        
        /* Navigation Tabs */
        .nav-bar { display: flex; justify-content: space-around; background: #fff; padding: 10px 0; border-top: 1px solid #ddd; position: fixed; bottom: 0; left: 0; right: 0; max-width: 450px; margin: auto; }
        .nav-item { border: none; background: none; font-size: 14px; font-weight: bold; color: #666; cursor: pointer; }
        .nav-item.active { color: var(--primary); }

        /* Calendar Styles */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .day-name { font-weight: bold; background: #eee; padding: 5px 0; border-radius: 4px; font-size: 12px; }
        .cell { padding: 12px 0; border-radius: 6px; font-weight: bold; background: #f8f9fa; cursor: pointer; font-size: 13px; border: 1px solid #ddd; }
        
        /* Full Cell Colors */
        .cell.present { background-color: var(--success) !important; color: white !important; border-color: var(--success); }
        .cell.absent { background-color: var(--danger) !important; color: white !important; border-color: var(--danger); }
        .cell.halfday { background-color: var(--warning) !important; color: white !important; border-color: var(--warning); }
        .cell.overtime { background-color: var(--info) !important; color: white !important; border-color: var(--info); }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container" style="padding-bottom: 70px;">
    <h2>My Finance</h2>

    <!-- PAGE 1: DASHBOARD -->
    <div id="pageDashboard">
        <div class="card" style="text-align: center;">
            <p style="margin:0; font-size: 14px; color: #666;">Total Balance</p>
            <h1 style="margin:5px 0; color: #28a745;">₹<span id="balance">0</span></h1>
        </div>

        <div class="card">
            <h3>Add Transaction</h3>
            <label>Amount (₹)</label>
            <input type="number" id="txAmount" placeholder="Enter amount">
            <label>Type</label>
            <select id="txType">
                <option value="income">Income (+)</option>
                <option value="expense">Expense (-)</option>
            </select>
            <label>Description</label>
            <input type="text" id="txDesc" placeholder="e.g. Salary, Food, Fuel">
            <button class="btn btn-success" onclick="addTransaction()">Save Transaction</button>
        </div>
    </div>

    <!-- PAGE 2: CALENDAR & ATTENDANCE -->
    <div id="pageCalendar" class="hidden">
        <div class="calendar-header">
            <button class="btn" style="width: auto; padding: 5px 12px;" onclick="changeMonth(-1)">&lt;</button>
            <h3 id="monthYearTitle" style="margin: 0;">Month Year</h3>
            <button class="btn" style="width: auto; padding: 5px 12px;" onclick="changeMonth(1)">&gt;</button>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>

        <!-- Monthly Attendance Summary -->
        <div class="card" style="margin-top: 15px;">
            <h4 style="margin-top: 0; text-align: center;">Monthly Summary</h4>
            <p>🟢 Present: <b id="countPresent">0</b> days</p>
            <p>🔴 Absent: <b id="countAbsent">0</b> days</p>
            <p>🟠 Half Day: <b id="countHalfDay">0</b> days</p>
            <p>🔵 Over Time: <b id="countOT">0</b> days</p>
        </div>

        <!-- Selected Day Action Box -->
        <div id="dayActionBox" class="card hidden">
            <h4 style="margin-top: 0;">Selected Date: <span id="selectedDateText"></span></h4>
            <div class="action-grid">
                <button class="btn btn-success" onclick="setAttendance('present')">Present</button>
                <button class="btn btn-danger" onclick="setAttendance('absent')">Absent</button>
                <button class="btn btn-warning" onclick="setAttendance('halfday')">Half Day</button>
                <button class="btn btn-info" onclick="setAttendance('overtime')">Over Time</button>
            </div>
            <button class="btn btn-clear" style="margin-top: 8px;" onclick="setAttendance('clear')">Clear Status</button>
        </div>

        <!-- OT Calculator Section -->
        <div class="card">
            <h3>OT Calculator</h3>
            <label>Monthly Salary (₹)</label>
            <input type="number" id="otSalary" placeholder="e.g., 25000">
            <label>Days in Month</label>
            <input type="number" id="otDays" value="30">
            <button class="btn btn-info" onclick="calcOTRate()">Calculate Hourly OT Rate</button>
            
            <div id="otRateResult" style="margin-top: 10px; font-weight: bold; color: #17a2b8;"></div>

            <hr style="margin: 15px 0;">

            <label>OT Hours Worked</label>
            <input type="number" id="otHours" placeholder="Enter OT Hours">
            <button class="btn btn-success" onclick="addOTToBalance()">Add OT Amount to Balance</button>
        </div>
    </div>

    <!-- PAGE 3: SETTINGS LOGIN -->
    <div id="pageSettingsLogin" class="hidden">
        <div class="card">
            <h3>Settings Password</h3>
            <input type="password" id="passInput" placeholder="Enter Password">
            <button class="btn" onclick="verifyPassword()">Login</button>
        </div>
    </div>

    <!-- PAGE 4: SETTINGS PANEL -->
    <div id="pageSettingsPanel" class="hidden">
        <div class="card">
            <h3>AI Assistant & Settings</h3>
            <p>Welcome, Admin!</p>
            <label>AI Assistant Command:</label>
            <input type="text" id="aiCommand" placeholder="e.g., Reset balance or calculate savings">
            <button class="btn" onclick="runAIAssistant()">Execute AI Command</button>
            <div id="aiResponse" class="card hidden" style="margin-top: 10px; background: #fff;"></div>
            <button class="btn btn-danger" style="margin-top: 20px;" onclick="logoutSettings()">Logout Settings</button>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <div class="nav-bar">
        <button class="nav-item active" id="navDash" onclick="showPage('dashboard')">Dashboard</button>
        <button class="nav-item" id="navCal" onclick="showPage('calendar')">Calendar & OT</button>
        <button class="nav-item" id="navSet" onclick="showPage('settings')">Settings</button>
    </div>
</div>

<script>
    let state = {
        balance: 0,
        attendance: {}, 
        calculatedOTRate: 0
    };

    let currentDate = new Date();
    let selectedDateStr = null;

    function showPage(page) {
        document.getElementById('pageDashboard').classList.add('hidden');
        document.getElementById('pageCalendar').classList.add('hidden');
        document.getElementById('pageSettingsLogin').classList.add('hidden');
        document.getElementById('pageSettingsPanel').classList.add('hidden');

        document.getElementById('navDash').classList.remove('active');
        document.getElementById('navCal').classList.remove('active');
        document.getElementById('navSet').classList.remove('active');

        if (page === 'dashboard') {
            document.getElementById('pageDashboard').classList.remove('hidden');
            document.getElementById('navDash').classList.add('active');
        } else if (page === 'calendar') {
            document.getElementById('pageCalendar').classList.remove('hidden');
            document.getElementById('navCal').classList.add('active');
            renderCalendar();
        } else if (page === 'settings') {
            document.getElementById('pageSettingsLogin').classList.remove('hidden');
            document.getElementById('navSet').classList.add('active');
        }
    }

    function addTransaction() {
        const amt = parseFloat(document.getElementById('txAmount').value);
        const type = document.getElementById('txType').value;
        if (isNaN(amt) || amt <= 0) return alert('Enter valid amount');

        if (type === 'income') state.balance += amt;
        else state.balance -= amt;

        document.getElementById('balance').innerText = state.balance.toFixed(2);
        document.getElementById('txAmount').value = '';
        document.getElementById('txDesc').value = '';
        alert('Transaction Added Successfully!');
    }

    // CALENDAR FUNCTIONS
    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        document.getElementById('monthYearTitle').innerText = `${monthNames[month]} ${year}`;

        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        dayNames.forEach(d => {
            const div = document.createElement('div');
            div.className = 'day-name';
            div.innerText = d;
            grid.appendChild(div);
        });

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
            grid.appendChild(document.createElement('div'));
        }

        let counts = { present: 0, absent: 0, halfday: 0, overtime: 0 };

        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = day;

            const status = state.attendance[dateStr];
            if (status) {
                cell.classList.add(status);
                counts[status] = (counts[status] || 0) + 1;
            }

            cell.onclick = () => selectDate(dateStr);
            grid.appendChild(cell);
        }

        document.getElementById('countPresent').innerText = counts.present;
        document.getElementById('countAbsent').innerText = counts.absent;
        document.getElementById('countHalfDay').innerText = counts.halfday;
        document.getElementById('countOT').innerText = counts.overtime;
    }

    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
    }

    function selectDate(dateStr) {
        selectedDateStr = dateStr;
        document.getElementById('selectedDateText').innerText = dateStr;
        document.getElementById('dayActionBox').classList.remove('hidden');
    }

    function setAttendance(type) {
        if (!selectedDateStr) return;
        if (type === 'clear') delete state.attendance[selectedDateStr];
        else state.attendance[selectedDateStr] = type;

        renderCalendar();
    }

    // OT CALCULATION: Salary / Month Days / 11 Hours
    function calcOTRate() {
        const salary = parseFloat(document.getElementById('otSalary').value);
        const days = parseFloat(document.getElementById('otDays').value);

        if (isNaN(salary) || salary <= 0 || isNaN(days) || days <= 0) {
            return alert('Enter valid salary and month days');
        }

        state.calculatedOTRate = salary / (days * 11);
        document.getElementById('otRateResult').innerHTML = `Calculated Hourly OT Rate: <b>₹${state.calculatedOTRate.toFixed(2)}</b> / hr`;
    }

    function addOTToBalance() {
        const hours = parseFloat(document.getElementById('otHours').value);
        if (isNaN(hours) || hours <= 0) return alert('Enter valid OT hours');
        
        // જો Rate கணക്കാക്കിയിട്ടില്ലെങ്കിൽ ഓട്ടോമാറ്റിക്കായി സാലറി ഫീൽഡ് നോക്കി കണക്കാക്കും
        if (state.calculatedOTRate <= 0) {
            const salary = parseFloat(document.getElementById('otSalary').value);
            const days = parseFloat(document.getElementById('otDays').value);
            if (!isNaN(salary) && !isNaN(days) && days > 0) {
                state.calculatedOTRate = salary / (days * 11);
            } else {
                return alert('Please calculate OT Rate first by entering Salary and Days!');
            }
        }

        const otTotal = hours * state.calculatedOTRate;
        state.balance += otTotal;
        document.getElementById('balance').innerText = state.balance.toFixed(2);
        document.getElementById('otHours').value = '';
        alert(`Successfully Added ₹${otTotal.toFixed(2)} OT pay to Balance!`);
    }

    // SETTINGS & PASSWORD
    function verifyPassword() {
        const pass = document.getElementById('passInput').value;
        if (pass === 'Surya@777') {
            document.getElementById('pageSettingsLogin').classList.add('hidden');
            document.getElementById('pageSettingsPanel').classList.remove('hidden');
            document.getElementById('passInput').value = '';
        } else {
            alert('Wrong Password! Use Surya@777');
        }
    }

    function logoutSettings() {
        showPage('dashboard');
    }

    function runAIAssistant() {
        const cmd = document.getElementById('aiCommand').value;
        const resDiv = document.getElementById('aiResponse');
        resDiv.classList.remove('hidden');
        resDiv.innerHTML = "<b>AI Assistant:</b> Successfully processed '" + cmd + "'";
    }
</script>

</body>
</html>
